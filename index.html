    </style>

<body>
    <header>
        <h1><i class="fas fa-music"></i> Smoker Player</h1>
    </header>

    <div class="container">
        <section class="player-section">
            <h2 class="section-title"><i class="fas fa-play-circle"></i> Сейчас играет</h2>
            <div class="now-playing">
                <div class="album-art" id="album-art">
                    <i class="fas fa-music"></i>
                    <div class="overlay">
                        <i class="fas fa-play"></i>
                    </div>
                </div>
                <div class="song-info">
                    <div class="song-title" id="song-title">Выберите трек</div>
                    <div class="song-artist" id="song-artist">Из вашего плейлиста</div>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-info">
                    <span class="current-time" id="current-time">0:00</span>
                    <span class="duration" id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" id="prev">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="control-btn play-pause" id="play-pause">
                    <i class="fas fa-play"></i>
                </button>
                <button class="control-btn" id="next">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>

            <div class="volume-container">
                <i class="fas fa-volume-up"></i>
                <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="0.1">
            </div>

            <div class="visualizer" id="visualizer">
                <!-- Bars will be generated by JavaScript -->
            </div>
        </section>

        <section class="playlist-section">
            <h2 class="section-title"><i class="fas fa-list"></i> Ваш плейлист</h2>

            <div class="search-container">
                <input type="text" id="search-input" placeholder="Поиск музыки...">
                <button id="search-button"><i class="fas fa-search"></i></button>
            </div>

            <div class="tabs">
                <div class="tab active" data-tab="user">Ваша музыка</div>
                <div class="tab" data-tab="playlists">Плейлисты</div>
                <div class="tab" data-tab="artists">Артисты</div>
            </div>

            <div class="tab-content active" id="user-playlist">
                <ul class="playlist" id="playlist">
                    <li class="playlist-item">
                        <div class="play-icon">
                            <i class="fas fa-music"></i>
                        </div>
                        <div class="song-details">
                            <div class="title">Выберите трек из плейлистов</div>
                            <div class="artist">Или добавьте свои</div>
                        </div>
                        <div class="duration">0:00</div>
                    </li>
                </ul>
            </div>

            <div class="tab-content" id="playlists-tab">
                <div class="playlist-grid" id="playlists-grid">
                    <!-- Playlists will be added here -->
                </div>
            </div>

            <div class="tab-content" id="artists-tab">
                <div class="artists-grid" id="artists-grid">
                    <!-- Artists will be added here -->
                </div>
            </div>
        </section>
    </div>

    <section class="popular-section">
        <h2 class="section-title"><i class="fas fa-fire"></i> Популярная музыка</h2>
        <p>Наслаждайтесь лучшими треками</p>
        <div class="popular-grid" id="popular-grid">
            <!-- Popular songs will be added here -->
        </div>
    </section>

    <footer>
        <p>Smoker Player &copy; 2026</p>
        <a href="index2.html">Tccc</a>
    </footer>

            // Элементы DOM
            const playPauseBtn = document.getElementById('play-pause');
            const prevBtn = document.getElementById('prev');
            const nextBtn = document.getElementById('next');
            const volumeSlider = document.getElementById('volume');
            const progressBar = document.getElementById('progress');
            const progressContainer = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const durationEl = document.getElementById('duration');
            const songTitle = document.getElementById('song-title');
            const songArtist = document.getElementById('song-artist');
            const albumArt = document.getElementById('album-art');
            const playlistEl = document.getElementById('playlist');
            const artistsGrid = document.getElementById('artists-grid');
            const popularGridEl = document.getElementById('popular-grid');
            const playlistsGrid = document.getElementById('playlists-grid');
            const visualizer = document.getElementById('visualizer');
            const tabs = document.querySelectorAll('.tab');
            const tabContents = document.querySelectorAll('.tab-content');
            const audioPlayer = document.getElementById('audio-player');
            // Текущее состояние
            let isPlaying = false;
            let currentSongIndex = 0;
            let visualizerBars = [];
            let playlist = [];

            // Установка громкости по умолчанию 10%
            volumeSlider.value = 0.1;
            audioPlayer.volume = 0.1;

            // Переключение вкладок
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // Удаляем активный класс у всех вкладок
                    tabs.forEach(t => t.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));

                    // Добавляем активный класс текущей вкладке
                    tab.classList.add('active');
                    document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
                });
            });

            // Инициализация визуализатора
            function initVisualizer() {
                visualizer.innerHTML = '';
                visualizerBars = [];

                for (let i = 0; i < 40; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'bar';
                    // Начальная высота с учетом плавности
                    bar.style.height = `${Math.random() * 80 + 20}px`;
                    bar.style.transition = `height ${UPDATE_INTERVAL / 1000}s ease-out, opacity ${UPDATE_INTERVAL / 1000}s ease-out`;
                    visualizer.appendChild(bar);
                    visualizerBars.push(bar);
                }

                // Сбрасываем время последнего обновления
                lastUpdateTime = 0;
            }

            // Обновление визуализатора
            let lastUpdateTime = 0;
            const UPDATE_INTERVAL = 300; // Интервал в миллисекундах

            function updateVisualizer(timestamp) {
                if (!isPlaying) return;

                // Обновляем только если прошло достаточно времени
                if (timestamp - lastUpdateTime > UPDATE_INTERVAL) {
                    lastUpdateTime = timestamp;

                    visualizerBars.forEach(bar => {
                        const newHeight = Math.random() * 80 + 20;
                        bar.style.height = `${newHeight}px`;
                        bar.style.opacity = 0.7 + Math.random() * 0.3;
                    });
                }

                requestAnimationFrame(updateVisualizer);
            }

            // Получение песен для плейлиста
            function getSongsForPlaylist(playlistId) {
                return musicData.songs.filter(song =>
                    song.playlistIds && song.playlistIds.includes(playlistId)
                );
            }

            // Получение песен для артиста
            function getSongsForArtist(artistId) {
                return musicData.songs.filter(song => song.artistId === artistId);
            }

            // Получение популярных песен (первые 20)
            function getPopularSongs() {
                return musicData.songs.slice(0, 20);
            }

            // Загрузка песни
            function loadSong(index) {
                if (playlist.length === 0) return;

                const song = playlist[index];
                songTitle.textContent = song.title || "Неизвестный трек";
                songArtist.textContent = song.artist || "Неизвестный исполнитель";

                // Обновление обложки
                if (song.cover) {
                    albumArt.innerHTML = `
                        <img src="${song.cover}" alt="${song.title}">
                        <div class="overlay">
                            <i class="fas fa-play"></i>
                        </div>
                    `;
                } else {
                    albumArt.innerHTML = `
                        <i class="fas fa-music"></i>
                        <div class="overlay">
                            <i class="fas fa-play"></i>
                        </div>
                    `;
                }

                // Установка источника аудио
                audioPlayer.src = song.url;
                audioPlayer.load();

                // Обновление активного элемента плейлиста
                document.querySelectorAll('.playlist-item').forEach((item, idx) => {
                    if (idx === index) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });

                // Воспроизведение, если плеер был включен
                if (isPlaying) {
                    audioPlayer.play().catch(e => console.error("Ошибка воспроизведения:", e));
                }
            }

            // Воспроизведение/пауза
            function togglePlay() {
                if (playlist.length === 0) {
                    alert("Пожалуйста, выберите трек из плейлиста!");
                    return;
                }

                isPlaying = !isPlaying;

                if (isPlaying) {
                    playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    audioPlayer.play().catch(e => console.error("Ошибка воспроизведения:", e));
                    updateVisualizer();
                } else {
                    playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                    audioPlayer.pause();
                }
            }

            // Предыдущая песня
            function prevSong() {
                if (playlist.length === 0) return;

                currentSongIndex--;
                if (currentSongIndex < 0) {
                    currentSongIndex = playlist.length - 1;
                }
                loadSong(currentSongIndex);
            }

            // Следующая песня
            function nextSong() {
                if (playlist.length === 0) return;

                currentSongIndex++;
                if (currentSongIndex > playlist.length - 1) {
                    currentSongIndex = 0;
                }
                loadSong(currentSongIndex);
            }

            // Обновление прогресс-бара
            function updateProgress(e) {
                if (playlist.length === 0) return;

                const width = this.clientWidth;
                const clickX = e.offsetX;
                const duration = audioPlayer.duration;

                // Расчет нового времени
                const newTime = (clickX / width) * duration;
                audioPlayer.currentTime = newTime;
            }

            // Обновление времени
            function updateTime() {
                // Обновляем текущее время
                const currentMinutes = Math.floor(audioPlayer.currentTime / 60);
                const currentSeconds = Math.floor(audioPlayer.currentTime % 60);
                currentTimeEl.textContent = `${currentMinutes}:${currentSeconds < 10 ? '0' + currentSeconds : currentSeconds}`;

                // Обновляем длительность
                const durationMinutes = Math.floor(audioPlayer.duration / 60);
                const durationSeconds = Math.floor(audioPlayer.duration % 60);
                durationEl.textContent = `${durationMinutes}:${durationSeconds < 10 ? '0' + durationSeconds : durationSeconds}`;

                // Обновляем прогресс-бар
                const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.style.width = `${progressPercent}%`;
            }

            // Установка громкости
            function setVolume() {
                audioPlayer.volume = volumeSlider.value;
            }

            // Генерация плейлистов
            function generatePlaylists() {
                musicData.playlists.forEach(playlist => {
                    const playlistCard = document.createElement('div');
                    playlistCard.className = 'playlist-item-card';
                    playlistCard.innerHTML = `
                        <div class="cover">
                            <img src="${playlist.cover}" alt="${playlist.name}">
                        </div>
                        <div class="name">${playlist.name}</div>
                        <div class="count">${getSongsForPlaylist(playlist.id).length} треков</div>
                    `;

                    playlistCard.addEventListener('click', () => {
                        loadPlaylist(playlist);
                    });

                    playlistsGrid.appendChild(playlistCard);
                });
            }

            // Генерация списка артистов
            function generateArtistsList() {
                musicData.artists.forEach(artist => {
                    const artistCard = document.createElement('div');
                    artistCard.className = 'artist-card';
                    artistCard.innerHTML = `
                        <div class="avatar">
                            ${artist.avatar ?
                            `<img src="${artist.avatar}" alt="${artist.name}">` :
                            `<i class="fas fa-user"></i>`}
                        </div>
                        <div class="name">${artist.name}</div>
                        <div class="genre">${artist.genre}</div>
                        <div class="songs">${getSongsForArtist(artist.id).length} треков</div>
                    `;

                    // Добавляем обработчик клика на артиста
                    artistCard.addEventListener('click', () => {
                        addArtistSongsToPlaylist(artist);
                    });

                    artistsGrid.appendChild(artistCard);
                });
            }

            // Функция добавления треков артиста в плейлист
            function addArtistSongsToPlaylist(artist) {
                // Очищаем текущий плейлист
                playlist = [currentSongIndex];

                // Добавляем все треки артиста
                const artistSongs = getSongsForArtist(artist.id);
                artistSongs.forEach(song => {
                    playlist.push(song);
                });

                // Обновляем отображение плейлиста
                playlistEl.innerHTML = '';
                generateUserPlaylist();



                // Переключаемся на вкладку "Ваша музыка"
                tabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));

                document.querySelector('.tab[data-tab="user"]').classList.add('active');
                document.getElementById('user-playlist').classList.add('active');

                // Начинаем воспроизведение
                if (!isPlaying) {
                    togglePlay();
                }

                // Показываем уведомление
                showNotification(`Добавлены треки артиста: ${artist.name}`);
            }

            // Загрузка плейлиста
            function loadPlaylist(playlistData) {
                // Очищаем текущий плейлист
                playlist = [currentSongIndex];

                // Добавляем все песни из выбранного плейлиста
                const playlistSongs = getSongsForPlaylist(playlistData.id);
                playlistSongs.forEach(song => {
                    playlist.push({
                        ...song,
                        cover: song.cover || playlistData.cover
                    });
                });

                // Обновляем отображение плейлиста
                playlistEl.innerHTML = '';
                generateUserPlaylist();



                // Переключаемся на вкладку "Ваша музыка"
                tabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));

                document.querySelector('.tab[data-tab="user"]').classList.add('active');
                document.getElementById('user-playlist').classList.add('active');

                // Начинаем воспроизведение
                if (!isPlaying) {
                    togglePlay();
                }

                // Показываем уведомление
                showNotification(`Загружен плейлист: ${playlistData.name}`);
            }

            // Генерация популярного плейлиста
            function generatePopularPlaylist() {
                const popularSongs = getPopularSongs();
                popularSongs.forEach((song) => {
                    // Для сетки популярной музыки
                    const songCard = document.createElement('div');
                    songCard.className = 'popular-song';
                    songCard.innerHTML = `
                        <div class="cover">
                            ${song.cover ? `<img src="${song.cover}" alt="${song.title}">` : '<i class="fas fa-music"></i>'}
                            <div class="overlay">
                                <i class="fas fa-play"></i>
                            </div>
                        </div>
                        <div class="title">${song.title}</div>
                        <div class="artist">${song.artist}</div>
                        <div class="duration">${song.duration}</div>
                        <div style="display: flex; justify-content: flex-end; margin-top: 15px;">
                            <div class="play-btn">
                                <i class="fas fa-play"></i>
                            </div>
                        </div>
                    `;

                    songCard.querySelector('.play-btn').addEventListener('click', function (e) {
                        e.stopPropagation();
                        addSongToPlaylist(song);
                    });

                    popularGridEl.appendChild(songCard);
                });
            }

            // Добавление песни в плейлист
            function addSongToPlaylist(song) {
                // Проверяем, есть ли песня уже в плейлисте
                const songExists = playlist.some(s => s.id === song.id);

                if (!songExists) {
                    playlist.push(song);

                    // Обновляем плейлист
                    playlistEl.innerHTML = '';
                    generateUserPlaylist();
                }

                // Устанавливаем текущую песню
                currentSongIndex = playlist.findIndex(s => s.id === song.id);
                loadSong(currentSongIndex);

                // Начинаем воспроизведение
                if (!isPlaying) {
                    togglePlay();
                }

                // Показываем уведомление
                showNotification(`Добавлен трек: ${song.title}`);
            }

            // Генерация пользовательского плейлиста
            function generateUserPlaylist() {
                playlist.forEach((song, index) => {
                    const li = document.createElement('li');
                    li.className = 'playlist-item';
                    if (index === currentSongIndex) {
                        li.classList.add('active');
                    }

                    li.innerHTML = `
                        <div class="play-icon">
                            <i class="fas fa-music"></i>
                        </div>
                        <div class="song-details">
                            <div class="title">${song.title}</div>
                            <div class="artist">${song.artist}</div>
                        </div>
                        <div class="duration">${song.duration}</div>
                    `;

                    li.addEventListener('click', () => {
                        currentSongIndex = index;
                        loadSong(currentSongIndex);
                        if (!isPlaying) {
                            togglePlay();
                        }
                    });

                    playlistEl.appendChild(li);
                });
            }

            // Функция для поиска музыки
            function searchMusic(query) {
                const results = [];
                const lowerQuery = query.toLowerCase().trim();

                if (!lowerQuery) return results;

                // Поиск по всем песням
                musicData.songs.forEach(song => {
                    if (song.title.toLowerCase().includes(lowerQuery) ||
                        song.artist.toLowerCase().includes(lowerQuery)) {
                        results.push(song);
                    }
                });

                return results;
            }

            // Функция для отображения результатов поиска
            function displaySearchResults(results) {
                // Очищаем текущий плейлист
                playlistEl.innerHTML = '';

                if (results.length === 0) {
                    playlistEl.innerHTML = `
                        <li class="playlist-item">
                            <div class="play-icon">
                                <i class="fas fa-music"></i>
                            </div>
                            <div class="song-details">
                                <div class="title">Ничего не найдено</div>
                                <div class="artist">Попробуйте другой запрос</div>
                            </div>
                            <div class="duration">0:00</div>
                        </li>
                    `;
                    return;
                }

                // Добавляем найденные треки
                results.forEach((song, index) => {
                    const li = document.createElement('li');
                    li.className = 'playlist-item';
                    li.innerHTML = `
                        <div class="play-icon">
                            <i class="fas fa-music"></i>
                        </div>
                        <div class="song-details">
                            <div class="title">${song.title}</div>
                            <div class="artist">${song.artist}</div>
                        </div>
                        <div class="duration">${song.duration}</div>
                    `;

                    li.addEventListener('click', () => {
                        // Обновляем текущий плейлист результатами поиска
                        playlist = results;
                        currentSongIndex = index;
                        loadSong(currentSongIndex);
                        if (!isPlaying) {
                            togglePlay();
                        }
                    });

                    playlistEl.appendChild(li);
                });
            }

            // Функция для показа уведомлений
            function showNotification(message) {
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: rgba(0, 0, 0, 0.9);
                    color: white;
                    padding: 15px 20px;
                    border-radius: 10px;
                    z-index: 10000;
                    animation: slideIn 0.3s ease;
                `;
                notification.textContent = message;
                document.body.appendChild(notification);

                setTimeout(() => {
                    notification.style.animation = 'slideOut 0.3s ease';
                    setTimeout(() => notification.remove(), 300);
                }, 3000);
            }

            // Инициализация
            function init() {
                initVisualizer();
                generatePlaylists();
                generateArtistsList();
                generatePopularPlaylist();
                generateUserPlaylist();

                // Добавляем обработчик для кнопки play/pause
                playPauseBtn.addEventListener('click', togglePlay);

                // Обработчики событий
                prevBtn.addEventListener('click', prevSong);
                nextBtn.addEventListener('click', nextSong);
                volumeSlider.addEventListener('input', setVolume);
                progressContainer.addEventListener('click', updateProgress);
                audioPlayer.addEventListener('timeupdate', updateTime);
                audioPlayer.addEventListener('ended', nextSong);

                // Обработчики событий для поиска
                document.getElementById('search-button').addEventListener('click', function () {
                    const query = document.getElementById('search-input').value;
                    const results = searchMusic(query);
                    displaySearchResults(results);
                });

                document.getElementById('search-input').addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        const query = this.value;
                        const results = searchMusic(query);
                        displaySearchResults(results);
                    }
                });

                // Загрузка первой песни при наличии
                if (playlist.length > 0) {
                    loadSong(currentSongIndex);
                }
            }

            // Функции для работы с оффлайн режимом
            function updateOnlineStatus() {
                const status = navigator.onLine ? 'online' : 'offline';
                document.body.classList.toggle('offline', !navigator.onLine);

                if (!navigator.onLine) {
                    showNotification('Вы в оффлайн режиме. Доступна только загруженная музыка.');
                }
            }

            // Инициализация приложения
            init();

            // Обработчики событий онлайн/оффлайн статуса
            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
            updateOnlineStatus();

            // Работа с Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.addEventListener('message', (event) => {
                    if (event.data.type === 'DOWNLOAD_PROGRESS') {
                        const { total, loaded } = event.data.progress;
                        const percent = Math.round((loaded / total) * 100);

                        const statusEl = document.getElementById('download-status');
                        const progressEl = document.getElementById('download-progress');
                        const infoEl = document.getElementById('download-info');

                        if (statusEl) {
                            statusEl.style.display = 'block';
                            progressEl.style.width = percent + '%';
                            progressEl.textContent = percent + '%';
                            infoEl.textContent = `Загружено ${loaded} из ${total} треков`;

                            if (loaded === total) {
                                setTimeout(() => {
                                    statusEl.style.display = 'none';
                                    showNotification('Вся музыка загружена! Теперь вы можете слушать оффлайн.');
                                }, 1000);
                            }
                        }
                    }

                    if (event.data.type === 'SW_ACTIVATED') {
                        console.log('Service Worker активирован');
                        checkCacheStatus();
                    }
                });

                // Кнопка загрузки всей музыки
                const downloadBtn = document.getElementById('download-all-btn');
                if (downloadBtn) {
                    downloadBtn.addEventListener('click', () => {
                        if (navigator.serviceWorker.controller) {
                            navigator.serviceWorker.controller.postMessage({
                                type: 'DOWNLOAD_ALL_MUSIC'
                            });
                            downloadBtn.disabled = true;
                            downloadBtn.textContent = 'Загрузка...';
                        }
                    });
                }
            }

            // Проверка статуса кеша
            async function checkCacheStatus() {
                if (!navigator.serviceWorker.controller) return;

                const channel = new MessageChannel();

                channel.port1.onmessage = (event) => {
                    const status = event.data;
                    console.log(`Кешировано ${status.cachedTracks} из ${status.totalTracks} треков`);

                    if (!status.isComplete) {
                        const statusEl = document.getElementById('download-status');
                        if (statusEl) {
                            statusEl.style.display = 'block';
                            document.getElementById('download-info').textContent =
                                `В кеше ${status.cachedTracks} из ${status.totalTracks} треков`;
                        }
                    }
                };

                navigator.serviceWorker.controller.postMessage(
                    { type: 'GET_CACHE_STATUS' },
                    [channel.port2]
                );
            }
        });
    </script>
</body>

</html>
