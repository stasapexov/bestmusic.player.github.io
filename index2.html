<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony Player - �����</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #000000, #969696, #ffffff);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

            body::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle at 10% 20%, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0) 20%), radial-gradient(circle at 80% 80%, rgba(0, 0, 0, 0.1) 0%, rgba(143, 0, 255, 0) 20%);
                z-index: -1;
            }

        .player-section {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            background: rgba(25, 25, 50, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            transition: all 0.3s ease;
        }

            .player-section.video-mode {
                padding: 0;
                height: 450px;
                overflow: hidden;
            }

        .toggle-mode-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        /* ����� ����� ����� */
        .audio-player {
            display: block;
        }

        .video-player-container {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .player-section.video-mode .audio-player {
            display: none;
        }

        .player-section.video-mode .video-player-container {
            display: block;
        }

        .video-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 15px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .video-player-container:hover .video-controls {
            opacity: 1;
        }

        .video-progress {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.2);
            margin-bottom: 10px;
            cursor: pointer;
        }

        .video-progress-filled {
            height: 100%;
            background: #ffffff;
            width: 0%;
        }

        .video-main-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-time {
            color: white;
            font-size: 14px;
        }

        /* ����� �������� */
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            color: #860000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .now-playing {
            text-align: center;
            margin-bottom: 30px;
        }

        .album-art {
            width: 250px;
            height: 250px;
            border-radius: 15px;
            margin: 0 auto 20px;
            overflow: hidden;
            box-shadow: 0px 10px 20px rgba(255, 255, 255, 0.4);
            background: linear-gradient(135deg, #000000, #000000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.8);
            position: relative;
        }

            .album-art img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .album-art .overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.4);
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
                transition: opacity 0.3s;
            }

            .album-art:hover .overlay {
                opacity: 1;
            }

        .song-info {
            margin-bottom: 15px;
        }

        .song-title {
            font-size: 1.8rem;
            margin-bottom: 5px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 1.2rem;
            color: #ccc;
        }

        .progress-container {
            margin: 25px 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 5px;
            position: relative;
        }

        .progress {
            height: 100%;
            background: linear-gradient(to right, #ffffff, #afafaf);
            border-radius: 3px;
            transition: width 0.1s linear;
            width: 0%;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #aaa;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 25px 0;
        }

        .control-btn {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1.2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

            .control-btn:hover {
                background: rgba(255, 255, 255, 0.1);
                transform: scale(1.1);
            }

            .control-btn.play-pause {
                width: 70px;
                height: 70px;
                background: linear-gradient(135deg, #000000, #414141);
                box-shadow: 0 5px 15px rgba(255, 255, 255, 0.4);
                font-size: 1.8rem;
            }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .volume-slider {
            flex: 1;
            height: 5px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            outline: none;
        }

            .volume-slider::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: #ffffff;
                cursor: pointer;
            }

        .visualizer {
            width: 100%;
            height: 120px;
            margin-top: 30px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
        }

        .bar {
            width: 8px;
            background: linear-gradient(to top, #000000,#ffffff);
            border-radius: 4px 4px 0 0;
            height: 20px;
            transition: height 0.5s ease-out, opacity 0.5s ease-out;
        }

        @media (max-width: 768px) {
            .player-section.video-mode {
                height: 300px;
            }

            .album-art {
                width: 200px;
                height: 200px;
            }

            .song-title {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .player-section {
                padding: 15px;
            }

            .album-art {
                width: 180px;
                height: 180px;
            }

            .control-btn {
                width: 45px;
                height: 45px;
                font-size: 1rem;
            }

                .control-btn.play-pause {
                    width: 60px;
                    height: 60px;
                    font-size: 1.5rem;
                }
        }
    </style>
</head>
<body>
    <section class="player-section" id="player-section">
        <button class="toggle-mode-btn" id="toggle-mode-btn">
            <i class="fas fa-video"></i>
        </button>

        <!-- ����� ����� -->
        <div class="audio-player" id="audio-player">
            <h2 class="section-title"><i class="fas fa-play-circle"></i> Тест клипов</h2>
            <div class="now-playing">
                <div class="album-art" id="album-art">
                    <i class="fas fa-music"></i>
                    <div class="overlay">
                        <i class="fas fa-play"></i>
                    </div>
                </div>
                <div class="song-info">
                    <div class="song-title" id="song-title">�������� ����</div>
                    <div class="song-artist" id="song-artist">�� ������ ���������</div>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-info">
                    <span class="current-time" id="current-time">0:00</span>
                    <span class="duration" id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" id="prev">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="control-btn play-pause" id="play-pause">
                    <i class="fas fa-play"></i>
                </button>
                <button class="control-btn" id="next">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>

            <div class="volume-container">
                <i class="fas fa-volume-up"></i>
                <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="0.1">
            </div>

            <div class="visualizer" id="visualizer">
                <!-- ������� ������������� ����� ��������� ����� JS -->
            </div>
        </div>

        <!-- ����� ����� -->
        <div class="video-player-container" id="video-player-container">
            <video class="video-player" id="video-player"></video>
            <div class="video-controls">
                <div class="video-progress" id="video-progress">
                    <div class="video-progress-filled" id="video-progress-filled"></div>
                </div>
                <div class="video-main-controls">
                    <button class="control-btn" id="video-play-pause">
                        <i class="fas fa-play"></i>
                    </button>
                    <div class="video-time" id="video-time">0:00 / 0:00</div>
                    <input type="range" class="volume-slider" id="video-volume" min="0" max="1" step="0.01" value="0.1">
                </div>
            </div>
        </div>
    </section>

    <!-- ����� ������� -->
    <audio id="audio-element"></audio>

    <script>
        const popularSongs = [
            {
                id: 101,
                title: "franchise",
                artist: "travis scott",
                duration: "3:55",
                cover: "https://upload.wikimedia.org/wikipedia/ru/f/f7/Travis_Scott_-_Franchise.png",
                url: "music/franchise.mp3",
                video: "music/FRANCHISE.mov"
            },
            {
                id: 2,
                title: "������ ����� 2",
                artist: "������ �����������",
                duration: "4:20",
                cover: "https://via.placeholder.com/500",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                video: "music/FRANCHISE.mov"
            }
        ];

        document.addEventListener('DOMContentLoaded', function () {
            // �������� DOM
            const playerSection = document.getElementById('player-section');
            const toggleModeBtn = document.getElementById('toggle-mode-btn');
            const audioPlayer = document.getElementById('audio-player');
            const videoPlayerContainer = document.getElementById('video-player-container');
            const videoPlayer = document.getElementById('video-player');
            const audioElement = document.getElementById('audio-element');

            // �������� ���������� �����
            const playPauseBtn = document.getElementById('play-pause');
            const prevBtn = document.getElementById('prev');
            const nextBtn = document.getElementById('next');
            const volumeSlider = document.getElementById('volume');
            const progressBar = document.getElementById('progress');
            const progressContainer = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const durationEl = document.getElementById('duration');
            const songTitle = document.getElementById('song-title');
            const songArtist = document.getElementById('song-artist');
            const albumArt = document.getElementById('album-art');
            const visualizer = document.getElementById('visualizer');

            // �������� ���������� �����
            const videoPlayPauseBtn = document.getElementById('video-play-pause');
            const videoProgress = document.getElementById('video-progress');
            const videoProgressFilled = document.getElementById('video-progress-filled');
            const videoTime = document.getElementById('video-time');
            const videoVolume = document.getElementById('video-volume');

            // ��������� ������
            let isPlaying = false;
            let isVideoMode = false;
            let visualizerBars = [];
            let currentSongIndex = 0;

            // ������������� �������������
            function initVisualizer() {
                visualizer.innerHTML = '';
                visualizerBars = [];

                for (let i = 0; i < 40; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'bar';
                    bar.style.height = `${Math.random() * 80 + 20}px`;
                    bar.style.transition = `height 0.3s ease-out, opacity 0.3s ease-out`;
                    visualizer.appendChild(bar);
                    visualizerBars.push(bar);
                }
            }

            // ���������� �������������
            function updateVisualizer() {
                if (!isPlaying) return;

                visualizerBars.forEach(bar => {
                    const newHeight = Math.random() * 80 + 20;
                    bar.style.height = `${newHeight}px`;
                    bar.style.opacity = 0.7 + Math.random() * 0.3;
                });

                requestAnimationFrame(updateVisualizer);
            }

            // �������� �����
            function loadSong(index) {
                const song = popularSongs[index];
                songTitle.textContent = song.title;
                songArtist.textContent = song.artist;
                durationEl.textContent = song.duration;

                // ���������� �������
                albumArt.innerHTML = `
                            <img src="${song.cover}" alt="${song.title}">
                            <div class="overlay">
                                <i class="fas fa-play"></i>
                            </div>
                        `;

                // ��������� ��������� �����
                audioElement.src = song.url;
                audioElement.load();

                // ��������� ��������� �����
                videoPlayer.src = song.video;
                videoPlayer.load();

                // ���������������, ���� ����� ��� �������
                if (isPlaying) {
                    playMedia();
                }
            }

            // ���������������/�����
            function togglePlay() {
                isPlaying = !isPlaying;
                playMedia();
            }

            // ���������� ���������������� � ����������� ��

            function playMedia() {
                if (isPlaying) {
                    if (isVideoMode) {
                        videoPlayer.play().catch(e => console.error("������ �����:", e));
                        videoPlayPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    } else {
                        audioElement.play().catch(e => console.error("������ �����:", e));
                        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        updateVisualizer();
                    }
                } else {
                    if (isVideoMode) {
                        videoPlayer.pause();
                        videoPlayPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                    } else {
                        audioElement.pause();
                        playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                    }
                }
            }

            // ������������ ����� ����� � ����� ��������
            function toggleMode() {
                isVideoMode = !isVideoMode;

                if (isVideoMode) {
                    playerSection.classList.add('video-mode');
                    toggleModeBtn.innerHTML = '<i class="fas fa-music"></i>';

                    // ������������� ���������
                    if (isPlaying) {
                        audioElement.pause();
                        videoPlayer.play().catch(e => console.error("������ �����:", e));
                    }
                } else {
                    playerSection.classList.remove('video-mode');
                    toggleModeBtn.innerHTML = '<i class="fas fa-video"></i>';

                    // ������������� ���������
                    if (isPlaying) {
                        videoPlayer.pause();
                        audioElement.play().catch(e => console.error("������ �����:", e));
                    }
                }
            }

            // ���������� �����
            function prevSong() {
                currentSongIndex--;
                if (currentSongIndex < 0) {
                    currentSongIndex = popularSongs.length - 1;
                }
                loadSong(currentSongIndex);
            }

            // ��������� �����
            function nextSong() {
                currentSongIndex++;
                if (currentSongIndex > popularSongs.length - 1) {
                    currentSongIndex = 0;
                }
                loadSong(currentSongIndex);
            }

            // ���������� ��������-���� �����
            function updateAudioProgress() {
                const currentTime = audioElement.currentTime;
                const duration = audioElement.duration || popularSongs[currentSongIndex].duration;

                // ��������� ������� �����
                const currentMinutes = Math.floor(currentTime / 60);
                const currentSeconds = Math.floor(currentTime % 60);
                currentTimeEl.textContent = `${currentMinutes}:${currentSeconds < 10 ? '0' + currentSeconds : currentSeconds}`;

                // ��������� ��������-���
                if (duration) {
                    const progressPercent = (currentTime / duration) * 100;
                    progressBar.style.width = `${progressPercent}%`;
                }
            }

            // ���������� ��������-���� �����
            function updateVideoProgress() {
                const currentTime = videoPlayer.currentTime;
                const duration = videoPlayer.duration || popularSongs[currentSongIndex].duration;

                if (duration) {
                    // ��������� �����
                    const currentMinutes = Math.floor(currentTime / 60);
                    const currentSeconds = Math.floor(currentTime % 60);
                    const durationMinutes = Math.floor(duration / 60);
                    const durationSeconds = Math.floor(duration % 60);

                    videoTime.textContent = `${currentMinutes}:${currentSeconds < 10 ? '0' + currentSeconds : currentSeconds} / ${durationMinutes}:${durationSeconds < 10 ? '0' + durationSeconds : durationSeconds}`;

                    // ��������� ��������-���
                    const progressPercent = (currentTime / duration) * 100;
                    videoProgressFilled.style.width = `${progressPercent}%`;
                }
            }

            // ��������� �����
            function seekAudio(e) {
                const width = this.clientWidth;
                const clickX = e.offsetX;
                const duration = audioElement.duration || popularSongs[currentSongIndex].duration;
                if (duration) {
                    audioElement.currentTime = (clickX / width) * duration;
                }
            }

            // ��������� �����
            function seekVideo(e) {
                const width = this.clientWidth;
                const clickX = e.offsetX;
                const duration = videoPlayer.duration || popularSongs[currentSongIndex].duration;
                if (duration) {
                    videoPlayer.currentTime = (clickX / width) * duration;
                }
            }

            // ��������� ��������� �����
            function setAudioVolume() {
                audioElement.volume = volumeSlider.value;
            }

            // ��������� ��������� �����
            function setVideoVolume() {
                videoPlayer.volume = videoVolume.value;
            }

            // �������������
            function init() {
                initVisualizer();
                loadSong(currentSongIndex);

                // ����������� �������
                toggleModeBtn.addEventListener('click', toggleMode);
                playPauseBtn.addEventListener('click', togglePlay);
                videoPlayPauseBtn.addEventListener('click', togglePlay);
                prevBtn.addEventListener('click', prevSong);
                nextBtn.addEventListener('click', nextSong);
                volumeSlider.addEventListener('input', setAudioVolume);
                videoVolume.addEventListener('input', setVideoVolume);
                progressContainer.addEventListener('click', seekAudio);
                videoProgress.addEventListener('click', seekVideo);
                audioElement.addEventListener('timeupdate', updateAudioProgress);
                videoPlayer.addEventListener('timeupdate', updateVideoProgress);

                // ������������� ��������� ��� ������������
                videoVolume.value = volumeSlider.value;

                // ����������� ��������� ���������������
                audioElement.addEventListener('ended', nextSong);
                videoPlayer.addEventListener('ended', nextSong);
            }

            init();
        });
    </script>
