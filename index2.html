<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f7">
    <title>Smoker Player — Тест клипов</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="catalog.js" defer></script>
    <script src="video.js" defer></script>
</head>
<body class="video-page">
    <header class="video-header">
        <a class="brand" href="index.html" aria-label="Вернуться к плееру">Smoker</a>
        <div class="theme-picker" role="group" aria-label="Тема оформления">
            <button class="theme-option" type="button" data-theme-value="light" aria-label="Светлая тема" aria-pressed="false">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/></svg>
            </button>
            <button class="theme-option" type="button" data-theme-value="dark" aria-label="Тёмная тема" aria-pressed="false">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.8A8.7 8.7 0 0 1 9.2 3.5 8.8 8.8 0 1 0 20.5 14.8Z"/></svg>
            </button>
        </div>
    </header>
    <main class="video-panel">
        <h1 class="page-title">Тест клипов</h1>
        <p id="demo-title" class="song-title"></p>
        <p id="demo-artist" class="song-artist"></p>
        <audio id="demo-audio" controls preload="metadata"></audio>
        <video id="demo-video" controls playsinline preload="none" hidden>
            <source src="music/FRANCHISE.mov" type="video/mp4">
        </video>
        <div class="controls">
            <button id="demo-prev" class="playlist-button" type="button">Назад</button>
            <button id="demo-mode" class="playlist-button primary" type="button">Смотреть клип</button>
            <button id="demo-next" class="playlist-button" type="button">Дальше</button>
        </div>
        <p id="demo-status" class="empty-message" role="status"></p>
    </main>
</body>
</html>
